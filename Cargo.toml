[package]
name = "ufrume"
description = "A multithreaded CLI tool to organize your music from messy into a structured system defined by you."
license = "GPL-3.0"
authors = ["PandaDEV <contact@pandadev.net>"]
version = "1.2.0"
edition = "2024"
repository = "https://github.com/0PandaDEV/ufrume"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
dirs = "7.0.0"
walkdir = "2.5.0"
lofty = "0.25.5"
symphonia = { version = "0.6.1", features = ["all"] }
ebur128 = "0.1.11"
indicatif = "0.18.6"
console = "0.16.6"
rayon = "1.12.0"
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "query"] }
flate2 = "1.1.11"
tar = "0.4.46"
self-replace = "1.5.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
terminal-colorsaurus = "1.0.3"
crossterm = "0.29.0"
unicode-normalization = "0.1.26"

[target."cfg(windows)".dependencies]
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
